# Render Blueprint — New → Blueprint → pick this repository.
services:
  - type: web
    name: nawa-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # entered in the Render dashboard, never committed
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_URL
        sync: false # deployed frontend URL(s), comma-separated
      - key: CLINIC_TIMEZONE
        value: Asia/Dubai
